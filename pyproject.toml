[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-matching-dit"
version = "0.1.0"
description = "Rectified flow matching with a class-conditional Diffusion Transformer (adaLN-Zero, classifier-free guidance, Euler/Heun samplers) and an FID implementation, trained on CIFAR-10."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["torch>=2.2", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "scipy>=1.11"]
train = ["torchvision>=0.17", "pytorch-fid>=0.3", "scipy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "E731"]
